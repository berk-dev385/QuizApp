<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuizApp</title>

    <script src="script.js"></script>

    <!-- Bootstrap files -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous">
        </script>

    <link rel="stylesheet" href="style.css">

</head>

<body onload="init()">

    <nav class="navbar bg-body-secondary">

        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">QuizApp</span>
        </div>

    </nav>

    <div class="container">
        <div class="card quiz-card">
            <img src="./assets/img/dalaman.jpg" id="header-image" class="card-img-top">

            <div class="progress" role="progressbar" >
                <div class="progress-bar" id="progress-bar-id" style="width: 0%">25%</div>
            </div>


            <div class="card-body" id="endScreen" style="display: none;">
                <div class="text-center final-headline">Quiz beendet
                </div>


                <div class="text-center">
                    Du hast <b id="amount-of-right-questions">?</b> Fragen von <b id="amount-of-questions">?</b> richtig
                    beantwortet.
                </div>

            </div>

            <div class="card-body" id="questionBody">
                <h5 class="card-title" id="questiontext">Welcher Ort ist das ? </h5>

                <div class="card quiz-answer-card mb-2" onclick="answer('answer_1')">
                    <div class="card-body" id="answer_1">
                        Antwort
                    </div>
                </div>
                <div class="card quiz-answer-card mb-2" onclick="answer('answer_2')">
                    <div class="card-body" id="answer_2">
                        Antwort
                    </div>
                </div>

                <div class="card quiz-answer-card mb-2" onclick="answer('answer_3')">
                    <div class="card-body" id="answer_3">
                        Antwort
                    </div>
                </div>

                <div class="card quiz-answer-card mb-2" onclick="answer('answer_4')">
                    <div class="card-body" id="answer_4">
                        Antwort
                    </div>
                </div>

                <div class="question-footer">
                    <span>
                        <b id="question-number">1</b> von <b id="all-questions">5</b> Fragen
                    </span>


                    <button onclick="nextQuestion()" class="btn btn-primary" id="next-button" disabled>nächste
                        Frage</button>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
